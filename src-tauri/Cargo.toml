[package]
name = "easywork"
version = "0.1.0"
edition = "2021"

[lib]
name = "easywork_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs", "io-util"] }

async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
futures = "0.3"
lettre = { version = "0.11", default-features = false, features = ["tokio1", "tokio1-rustls-tls", "smtp-transport", "builder", "hostname", "pool"] }
mail-parser = "0.11"

rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls-platform-verifier = "0.5"

rusqlite = { version = "0.32", features = ["bundled"] }
ammonia = "4"
reqwest = { version = "0.12", features = ["rustls-tls", "json", "stream"] }
urlencoding = "2"

tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
argon2 = { version = "0.5", features = ["std", "rand"] }
ical = "0.10"
base64 = "0.22"
tokio-postgres = { version = "0.7", features = ["runtime", "with-chrono-0_4", "with-uuid-1"] }
tokio-postgres-rustls = { version = "0.14", features = ["ring"] }

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-background-service = "1"

# keyring 3 必须显式启用平台后端 feature，否则 set_password 静默 no-op、
# get_password 报 NoEntry（E2E 实测：Windows 凭据管理器里根本没有条目）
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

[features]
# Required for release builds to embed the frontend dist assets and serve them
# via the Tauri custom protocol (https://tauri.localhost on Windows).
# `cargo build --release` must include `--features custom-protocol`.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# Strip debug symbols from the final binary (smaller portable exe; no runtime cost).
strip = true
