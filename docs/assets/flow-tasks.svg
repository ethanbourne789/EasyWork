<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fc"/>
      <stop offset="100%" stop-color="#eef0f6"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000015"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="620" rx="12" fill="url(#bg)"/>

  <!-- Title -->
  <rect x="20" y="20" width="760" height="48" rx="8" fill="url(#header)"/>
  <text x="400" y="50" text-anchor="middle" fill="white" font-size="18" font-weight="bold">任务管理 Tasks — 完整工作流</text>

  <!-- Row 1: Create Task -->
  <rect x="30" y="90" width="170" height="70" rx="10" fill="white" stroke="#6366f1" stroke-width="2" filter="url(#shadow)"/>
  <text x="115" y="115" text-anchor="middle" fill="#334155" font-size="13" font-weight="bold">新建任务</text>
  <text x="115" y="133" text-anchor="middle" fill="#64748b" font-size="10">标题 / 优先级</text>
  <text x="115" y="148" text-anchor="middle" fill="#64748b" font-size="10">截止日期 / 标签</text>

  <!-- Arrow -->
  <line x1="200" y1="125" x2="250" y2="125" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 1: View Options -->
  <rect x="250" y="90" width="170" height="70" rx="10" fill="white" stroke="#6366f1" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="115" text-anchor="middle" fill="#334155" font-size="13" font-weight="bold">选择视图</text>
  <text x="335" y="133" text-anchor="middle" fill="#64748b" font-size="10">看板 / 列表 / 日历</text>
  <text x="335" y="148" text-anchor="middle" fill="#64748b" font-size="10">三视图自由切换</text>

  <!-- Arrow -->
  <line x1="420" y1="125" x2="470" y2="125" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 1: Kanban -->
  <rect x="470" y="90" width="300" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2" filter="url(#shadow)"/>
  <text x="620" y="115" text-anchor="middle" fill="#334155" font-size="13" font-weight="bold">看板拖拽改状态</text>
  <text x="620" y="133" text-anchor="middle" fill="#64748b" font-size="10">待办 → 进行中 → 完成</text>
  <text x="620" y="148" text-anchor="middle" fill="#64748b" font-size="10">@dnd-kit 拖拽引擎</text>

  <!-- Row 2: Detail Drawer -->
  <rect x="30" y="190" width="220" height="80" rx="10" fill="white" stroke="#6366f1" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="215" text-anchor="middle" fill="#334155" font-size="13" font-weight="bold">任务详情抽屉</text>
  <text x="140" y="235" text-anchor="middle" fill="#64748b" font-size="10">编辑标题 / 描述</text>
  <text x="140" y="251" text-anchor="middle" fill="#64748b" font-size="10">修改状态 / 优先级 / 日期</text>
  <text x="140" y="267" text-anchor="middle" fill="#64748b" font-size="10">标签多选</text>

  <!-- Arrow down -->
  <line x1="140" y1="270" x2="140" y2="300" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 2: Subtasks -->
  <rect x="30" y="300" width="220" height="60" rx="10" fill="white" stroke="#6366f1" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="325" text-anchor="middle" fill="#334155" font-size="13" font-weight="bold">子任务管理</text>
  <text x="140" y="345" text-anchor="middle" fill="#64748b" font-size="10">增 / 删 / 勾选完成</text>

  <!-- Row 3: Recurring -->
  <rect x="30" y="390" width="220" height="80" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="415" text-anchor="middle" fill="#92400e" font-size="13" font-weight="bold">周期任务引擎</text>
  <text x="140" y="435" text-anchor="middle" fill="#78350f" font-size="10">daily / weekly / monthly</text>
  <text x="140" y="451" text-anchor="middle" fill="#78350f" font-size="10">interval + end_date</text>
  <text x="140" y="467" text-anchor="middle" fill="#78350f" font-size="10">完成后自动生成下一期</text>

  <!-- Right side: Data Flow -->
  <rect x="300" y="190" width="470" height="300" rx="10" fill="#f0fdf4" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <text x="535" y="218" text-anchor="middle" fill="#065f46" font-size="14" font-weight="bold">数据流（TanStack Query + Realtime）</text>

  <rect x="320" y="235" width="430" height="40" rx="6" fill="white"/>
  <text x="535" y="260" text-anchor="middle" fill="#334155" font-size="12">1. useQuery(["tasks"]) → Supabase SELECT</text>

  <rect x="320" y="285" width="430" height="40" rx="6" fill="white"/>
  <text x="535" y="310" text-anchor="middle" fill="#334155" font-size="12">2. 渲染看板 / 列表 / 日历视图</text>

  <rect x="320" y="335" width="430" height="40" rx="6" fill="white"/>
  <text x="535" y="360" text-anchor="middle" fill="#334155" font-size="12">3. Realtime 监听 postgres_changes 事件</text>

  <rect x="320" y="385" width="430" height="40" rx="6" fill="white"/>
  <text x="535" y="410" text-anchor="middle" fill="#334155" font-size="12">4. invalidateQueries(["tasks"]) 自动刷新</text>

  <rect x="320" y="435" width="430" height="40" rx="6" fill="white"/>
  <text x="535" y="460" text-anchor="middle" fill="#334155" font-size="12">5. 写操作 → useSafeMutation → 成功后失效缓存</text>

  <!-- Bottom: Deep Link -->
  <rect x="300" y="520" width="470" height="70" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <text x="535" y="548" text-anchor="middle" fill="#5b21b6" font-size="13" font-weight="bold">深链跳转 &amp; 跨模块联动</text>
  <text x="535" y="568" text-anchor="middle" fill="#6d28d9" font-size="11">?focus=id → 自动打开任务详情抽屉</text>
  <text x="535" y="584" text-anchor="middle" fill="#6d28d9" font-size="11">ew:navigate 事件 → 日历点击任务跳转任务页</text>
</svg>
