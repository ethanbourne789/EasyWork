<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fc"/>
      <stop offset="100%" stop-color="#eef0f6"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000015"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" rx="12" fill="url(#bg)"/>

  <!-- Title -->
  <rect x="20" y="20" width="760" height="48" rx="8" fill="url(#header)"/>
  <text x="400" y="50" text-anchor="middle" fill="white" font-size="18" font-weight="bold">仪表盘 Dashboard — 数据聚合流程</text>

  <!-- Step 1: Open App -->
  <rect x="310" y="90" width="180" height="50" rx="25" fill="#6366f1" filter="url(#shadow)"/>
  <text x="400" y="120" text-anchor="middle" fill="white" font-size="14" font-weight="bold">打开应用</text>

  <!-- Arrow 1 -->
  <line x1="400" y1="140" x2="400" y2="170" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Auth Check -->
  <rect x="290" y="170" width="220" height="50" rx="10" fill="white" stroke="#6366f1" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="192" text-anchor="middle" fill="#334155" font-size="13" font-weight="bold">认证检查</text>
  <text x="400" y="210" text-anchor="middle" fill="#64748b" font-size="11">Supabase Auth Session</text>

  <!-- Arrow 2 -->
  <line x1="400" y1="220" x2="400" y2="250" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: Load Data -->
  <rect x="240" y="250" width="320" height="56" rx="10" fill="white" stroke="#6366f1" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="274" text-anchor="middle" fill="#334155" font-size="13" font-weight="bold">并行加载数据</text>
  <text x="400" y="294" text-anchor="middle" fill="#64748b" font-size="11">任务 · 邮件 · 笔记 · 记账 · 通知</text>

  <!-- Arrow 3 -->
  <line x1="400" y1="306" x2="400" y2="336" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4: Render Cards -->
  <rect x="240" y="336" width="320" height="56" rx="10" fill="white" stroke="#6366f1" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="360" text-anchor="middle" fill="#334155" font-size="13" font-weight="bold">渲染概览卡片 + 今日聚焦</text>
  <text x="400" y="380" text-anchor="middle" fill="#64748b" font-size="11">4 张统计卡 + 前 4 条待办 + 支出趋势图</text>

  <!-- Arrow 4 -->
  <line x1="400" y1="392" x2="400" y2="422" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 5: User Action -->
  <rect x="260" y="422" width="280" height="56" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="446" text-anchor="middle" fill="#065f46" font-size="13" font-weight="bold">用户操作 → 跳转对应模块</text>
  <text x="400" y="466" text-anchor="middle" fill="#64748b" font-size="11">点击任务/邮件/记账 → 深链跳转</text>

  <!-- Side annotations -->
  <rect x="20" y="260" width="195" height="120" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="30" y="280" fill="#92400e" font-size="11" font-weight="bold">实时同步机制</text>
  <text x="30" y="300" fill="#78350f" font-size="10">Supabase Realtime</text>
  <text x="30" y="316" fill="#78350f" font-size="10">监听 20 张业务表变更</text>
  <text x="30" y="332" fill="#78350f" font-size="10">自动 invalidateQueries</text>
  <text x="30" y="348" fill="#78350f" font-size="10">近实时刷新界面</text>
  <text x="30" y="368" fill="#78350f" font-size="10">重连时显示顶部提示条</text>

  <rect x="585" y="260" width="195" height="120" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/>
  <text x="595" y="280" fill="#5b21b6" font-size="11" font-weight="bold">通知聚合机制</text>
  <text x="595" y="300" fill="#4c1d95" font-size="10">复用 Query 缓存数据</text>
  <text x="595" y="316" fill="#4c1d95" font-size="10">每 60s 周期刷新</text>
  <text x="595" y="332" fill="#4c1d95" font-size="10">三类通知：</text>
  <text x="605" y="348" fill="#4c1d95" font-size="10">  预算超支（黄色）</text>
  <text x="605" y="364" fill="#4c1d95" font-size="10">  任务到期（蓝色）</text>
  <text x="605" y="380" fill="#4c1d95" font-size="10">  邮件未读（绿色）</text>
</svg>
